<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AgentShield Midnight Escrow</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --accent:#7c3aed; --text:#e2e8f0; }
    body { font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); max-width: 760px; margin: 2rem auto; padding:1rem; }
    h1 { color:#a78bfa; margin-bottom:0.25rem; }
    .subtitle { color:#94a3b8; margin-bottom:1.5rem; }
    .card { background:var(--card); padding:1rem 1.25rem; border-radius:12px; margin-bottom:1rem; }
    .label { color:#94a3b8; font-size:0.85rem; }
    .value { font-family: monospace; word-break: break-all; }
    button { margin:0.25rem; padding:0.6rem 1.1rem; border:none; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; font-weight:600; }
    button:hover { filter: brightness(1.15); }
    pre { background:#0b1220; padding:1rem; border-radius:8px; white-space:pre-wrap; overflow:auto; max-height:320px; }
  </style>
</head>
<body>
  <h1>🛡️ AgentShield Midnight Escrow</h1>
  <p class="subtitle">Privacy-preserving conditional escrow on Midnight</p>
  <div class="card">
    <div class="label">Network</div><div class="value" id="net">local</div>
    <div class="label">Contract</div><div class="value" id="addr">b96b821f75a25b2dde9bdfdff4970304415565d9cc58747f985f66207c840d0a</div>
  </div>
  <div class="card">
    <button id="create">Create Escrow</button>
    <button id="release">Release Escrow</button>
    <button id="refund">Refund Escrow</button>
    <button id="store">Store "Hello World!"</button>
  </div>
  <div class="card">
    <div class="label">Ledger State</div>
    <pre id="state">Ready. Click a button to invoke a circuit.</pre>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
